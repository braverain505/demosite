    <path d="M166 352l-2 74-26 22-10 30h16l24-40 6 40h16l-10-82z" fill="#12305e"/>
    <path d="M224 352l14 74-8 42h24l-16-34-8-82z" fill="#12305e"/>
    <g fill="#0d3050"><rect x="128" y="446" width="30" height="10" rx="4"/><rect x="298" y="446" width="30" height="10" rx="4"/></g>
    <!-- single accent: homework folder -->
    <g transform="rotate(-10 316 316)">
      <rect x="306" y="296" width="34" height="42" rx="4" fill="#d9a24b"/>
      <rect x="306" y="296" width="34" height="42" rx="4" fill="none" stroke="#7c5217" stroke-width="3"/>
      <path d="M314 308h18M314 316h18M314 324h12" stroke="#7c5217" stroke-width="3" stroke-linecap="round"/>
    </g>
  </g>
