<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 520" role="img" aria-labelledby="t">
  <title id="t">A student with a backpack — illustrated, a placeholder for a real photograph</title>
  <defs>
    <linearGradient id="sk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9ddf8"/><stop offset=".6" stop-color="#e6f4fd"/><stop offset="1" stop-color="#f5efe0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#f8cd7a" stop-opacity=".8"/><stop offset="1" stop-color="#f8cd7a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="420" height="520" fill="url(#sk)"/>
  <circle cx="86" cy="150" r="130" fill="url(#glow)"/>
  <path d="M-10 438q215-64 440 0v82H-10z" fill="#fbf8ec" opacity=".92"/>
  <path d="M-10 474q215-48 430 0v84H-10z" fill="#efe8d4"/>
  <!-- distant campus -->
  <g fill="#0d5b8c" opacity=".16">
    <rect x="34" y="322" width="52" height="66"/><rect x="92" y="296" width="52" height="92"/>
    <rect x="300" y="312" width="40" height="78"/><rect x="346" y="288" width="50" height="102"/>
  </g>
  <!-- rolling field line -->
  <path d="M-10 396c92-30 170-36 246-22s138 16 194-8" fill="none" stroke="#0d6fa8" stroke-width="2" opacity=".22"/>
  <!-- student -->
  <g>
    <path d="M140 296c-16-4-30-12-40-24l6-10 30 2z" fill="#123a5e"/>
    <path d="M96 236l10 26-26 22-8-36z" fill="#1b6ba9"/>
    <path d="M116 246l44 10" stroke="#123a5e" stroke-width="10" stroke-linecap="round"/>
    <!-- torso -->
    <path d="M150 244c24 6 52 10 78 4l6 96-50 66h-34l-6-66z" fill="#2f86c4"/>
    <path d="M150 244c24 6 52 6 78 4l-4 34c-18 8-44 8-70 4z" fill="#f3c277"/>
    <!-- head -->
    <circle cx="196" cy="176" r="44" fill="#8a5a3a"/>
    <path d="M196 126c-30 0-46 16-46 42 0 6 2 12 6 16l40-4 40 4c4-4 6-10 6-16 0-26-16-42-46-42z" fill="#0d3050"/>
    <path d="M156 168c6-18 20-30 44-30s38 12 44 30c0 6-3 10-8 12l-72-2c-5-2-8-6-8-10z" fill="#14203a"/>
    <!-- arm up (wave) -->
    <path d="M226 268c38 6 56 22 62 44l-18 10c-6-18-22-30-50-34" fill="#1b6ba9"/>
    <circle cx="292" cy="332" r="12" fill="#8a5a3a"/>
